services:
  db:
    image: postgres:16
    container_name: politeia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: politeia
      POSTGRES_PASSWORD: politeia
      POSTGRES_DB: politeia
    ports:
      # Host port 5433 avoids clashing with other local Postgres instances.
      - "5433:5432"
    volumes:
      - politeia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politeia -d politeia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  politeia_pgdata:
