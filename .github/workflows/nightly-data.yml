name: Nightly data update

# Legacy Python import pipeline. Congress.gov + Quiver now run from
# .github/workflows/politeia-data-sync.yml. This job still applies Prisma
# migrations; do not use it to refresh Quiver/Congress.gov data.
on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements-data.txt

      - name: Install Node deps
        run: npm ci

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Run update-data pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python manage.py update-data
